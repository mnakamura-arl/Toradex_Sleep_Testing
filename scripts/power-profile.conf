# power-profile.conf - declare what a workload needs; everything else is
# powered down by 08-power-profile.sh.
#
# The point is reproducibility: this file IS the record of what state the
# board was in when a power number was measured. Commit it next to the run.
#
# Values are shell assignments; this file is sourced.

# ---------------------------------------------------------------- network ---

# Interfaces to keep UP. Space separated, matched exactly.
# SAFETY: the interface carrying the default route is ALWAYS kept, whether or
# not it is listed here - the script will not let you strand a headless board.
# Docker/bridge/veth interfaces are never touched.
KEEP_NET="ethernet0"

# Bring down CAN interfaces (can0, can1) and unload flexcan.  on | off
CAN=off

# -------------------------------------------------------------- radios ------

# Wi-Fi. off => rfkill block now, and blacklist mwifiex at boot.
# NOTE: mwifiex is the known suspend blocker on this board - its host-sleep
# handshake times out and the firmware then refuses every later suspend.
# If the shipping product needs Wi-Fi, do NOT just set this off; that hides
# the problem rather than solving it. See todo/006.
WIFI=off

# Bluetooth. off => rfkill block now, and blacklist hci_uart/btintel at boot.
BLUETOOTH=off

# ------------------------------------------------------------------ usb -----

# USB devices to keep bound, by sysfs bus id (e.g. "1-1.1 2-1").
# See `ls /sys/bus/usb/devices` or `lsusb -t`. Root hubs are never unbound.
# Empty string means "keep everything" (no USB action at all).
# Set to "none" to unbind every non-root-hub device.
KEEP_USB=""

# ------------------------------------------------------------- subsystems ---

# Vivante GPU (galcore). Safe to disable on a headless board.  on | off
GPU=off

# ------------------------------------------------------------------ notes ---
# Deliberately NOT touched by default, because they are plausibly real product
# hardware on this carrier - enable explicitly if you know otherwise:
#   industrialio / ti_ads1015   (ADC)
#   tpm_tis_spi                 (TPM; logs a benign -5 on each suspend)
